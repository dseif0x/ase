stages:
  - build
  - test

default:
  image: alpine:latest

# Job to generate the Doxygen documentation
generate_docs:
  stage: build
  before_script:
    - apk add --no-cache doxygen graphviz # Install Doxygen and Graphviz
  script:
    - cd engine
    - doxygen Doxyfile
    - cd ../web/backend
    - doxygen Doxyfile
    - cd ../java-driver
    - doxygen Doxyfile
    - cd ../..
  artifacts:
    paths:
      - engine/docs/html/   # Path where Doxygen output is generated
      - web/backend/docs/html/
      - web/java-driver/docs/html/
    expire_in: 1 week

variables:
  BUILD_DIR: engine/build
  TEST_DIRS: "core db"

build:
  stage: build
  before_script:
    - apk add --no-cache cmake clang make
  script:
    - mkdir -p $BUILD_DIR
    - cd $BUILD_DIR
    - cmake ..
    - cmake --build .
  artifacts:
    paths:
      - $BUILD_DIR

test:
  stage: test
  dependencies:
    - build
  script:
    - cd $BUILD_DIR
    - for folder in $FOLDER_LIST; do
        ctest --test-dir $folder;
        done

