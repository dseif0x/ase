stages:
  - build
  - test

default:
  image: alpine:latest

# Job to generate the Doxygen documentation
generate_docs:
  stage: build
  before_script:
    - apk add --no-cache doxygen graphviz # Install Doxygen and Graphviz
  script:
    - cd engine
    - doxygen Doxyfile
    - cd ../web/backend
    - doxygen Doxyfile
    - cd ../java-driver
    - doxygen Doxyfile
    - cd ../..
  artifacts:
    paths:
      - engine/docs/html/   # Path where Doxygen output is generated
      - web/backend/docs/html/
      - web/java-driver/docs/html/
    expire_in: 1 week

variables:
  BUILD_DIR: engine/build
  GTEST_DIRS: "core db server"
  JUNIT_DIRS: "java-driver backend"

build:
  stage: build
  before_script:
    - apk add --no-cache cmake build-base make
  script:
    - mkdir -p $BUILD_DIR
    - cd $BUILD_DIR
    - cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage ..
    - cmake --build .
  artifacts:
    paths:
      - $BUILD_DIR

build_release_linux_amd64:
  stage: build
  before_script:
    - apk add --no-cache cmake build-base make
  script:
    - mkdir -p $BUILD_DIR
    - cd $BUILD_DIR
    - cmake -DCMAKE_BUILD_TYPE=Release ..
    - cmake --build . --target db_static
    - cmake --build . --target db_test
  artifacts:
    paths:
      - $BUILD_DIR/db

build_release_windows_amd64:
  image: ubuntu:22.04
  stage: build
  before_script:
    - apt update && apt install -y cmake make
  script:
    - mkdir -p $BUILD_DIR
    - cd $BUILD_DIR
    - cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=toolchains/mingw-toolchain.cmake ..
    - cmake --build . --target db_static
    - cmake --build . --target db_test
  artifacts:
    paths:
      - $BUILD_DIR/db

build_release_macos_arm64:
  stage: build
  before_script:
    - apk add --no-cache cmake clang llvm lld make
  script:
    - mkdir -p $BUILD_DIR
    - cd $BUILD_DIR
    - cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=toolchains/macos-toolchain.cmake ..
    - cmake --build . --target db_static
    - cmake --build . --target db_test
  artifacts:
    paths:
      - $BUILD_DIR/db

gtest:
  stage: test
  dependencies:
    - build
  before_script:
    - apk add --no-cache cmake build-base lcov gzip
  script:
    - mkdir -p coverage_report
    - cd $BUILD_DIR
    - for folder in $GTEST_DIRS; do
        ctest --output-on-failure --test-dir $folder;
        lcov --ignore-errors mismatch --ignore-errors negative --directory $folder --capture --output-file $folder/coverage.info;
        lcov --remove $folder/coverage.info '/usr/*' '*googletest*' --output-file $folder/coverage.info;
        genhtml $folder/coverage.info --output-directory ../../coverage_report/$folder;
      done
  artifacts:
    paths:
      - coverage_report

junit:
  stage: test
  before_script:
    - apk add --no-cache openjdk17 maven
  script:
    - cd web
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - web/java-driver/target/surefire-reports/*.xml
        - web/backend/target/surefire-reports/*.xml
    paths:
      - web/java-driver/target/site/jacoco/
      - web/backend/target/site/jacoco/
    expire_in: 1 week
